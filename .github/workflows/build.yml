name: Multi-Platform Build (STM32 & Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Сборка прошивок для микроконтроллеров STM32
  build-stm32:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [ "stm32f401xc-debug", "stm32f411xe-debug" ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Ninja & ARM Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-arm-none-eabi

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build Firmware
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Upload STM32 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LetoAPI-${{ matrix.preset }}
        path: lib/${{ matrix.preset }}/
        if-no-files-found: error

  # 2. Сборка нативного приложения под Windows (MSVC)
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Ninja
      run: choco install ninja

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake --preset win-debug

    - name: Build Project
      run: cmake --build --preset win-debug

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LetoAPI-win-debug
        path: |
          bin/win-debug/
          lib/win-debug/
        if-no-files-found: error
